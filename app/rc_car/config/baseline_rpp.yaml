# Baseline arm: Nav2 Regulated Pure Pursuit (RPP) in a minimal controller_server.
# Phase 3 condition 1: constant speed (no curvature or proximity slow-down, no approach slow-down,
# no collision checking), an empty local costmap, pose from the mocap (mocap_bridge_node.py).
# The lookahead values below are the FROZEN result of the tuning grid (docs/rc_car/simulation_plan.md
# section 7.3); the harness can override them only in --tuning mode.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0          # = the NMPC's Ts = 0.05 s (Ackermann note section 5)
    enable_stamped_cmd_vel: true        # the command's stamp = the time it was computed
    odom_topic: odom                    # mocap pose + VESC speed telemetry (mocap_bridge_node.py)
    failure_tolerance: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28          # position only
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0           # overridden per run (the reference speed)
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.2               # FROZEN 2026-11-22 (tuning grid, checks/tuning_select.py); re-confirmed in B1 at RTF 1.0 under the new delta_max/track/payload
      min_lookahead_dist: 0.2           # FROZEN 2026-11-22 (tuning grid, checks/tuning_select.py)
      max_lookahead_dist: 2.0
      lookahead_dist: 0.6               # unused with the speed-scaled lookahead
      use_regulated_linear_velocity_scaling: false   # no curvature slow-down
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      approach_velocity_scaling_dist: 0.0            # no proximity (approach) slow-down
      min_approach_linear_velocity: 0.05
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_rotate_to_heading: false      # Ackermann: cannot rotate in place
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      interpolate_curvature_after_goal: false
      use_cancel_deceleration: false
      cancel_deceleration: 3.2
      max_robot_pose_search_dist: 1.0   # keeps the closest-point search local at the figure-eight crossing
      transform_tolerance: 0.3          # the mocap pose is up to ~0.1 s old (TF stamped with the capture time)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.2
      transform_tolerance: 0.3
      plugins: ["inflation_layer"]      # an empty costmap (ROS 2 parameters cannot hold an empty list)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
