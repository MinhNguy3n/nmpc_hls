# DIAGNOSTIC ONLY (C3 scrub check): rear-wheel drive. Same as controllers.yaml, but the wheel
# controller holds only the rear wheels; the front wheels roll freely (xacro drive:=rwd).
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz (design); the physics step is 1 ms (worlds/lab_floor.sdf)
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    steering_position_controller:
      type: position_controllers/JointGroupPositionController
    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

steering_position_controller:
  ros__parameters:
    joints: [front_left_steer_joint, front_right_steer_joint]

wheel_velocity_controller:
  ros__parameters:
    joints: [rear_left_wheel_joint, rear_right_wheel_joint]

# GazeboSimSystem turns a position command into a joint velocity proportional to the position
# error. The plant's steering response must stay much faster than the emulated servo of phase 2,
# so the gain is raised from its default (0.1); C4 measures the resulting step response. The
# plugin's node is named gz_ros_control (its log: "The position_proportional_gain has been set to").
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.5
